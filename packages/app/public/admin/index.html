<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Lord of the Rinse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #fff;
    padding: 2.5rem;
    border-radius: 1rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  .card-wide {
    max-width: 900px;
    text-align: left;
  }
  h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #0f172a; }
  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #6366f1; }
  button {
    padding: 0.75rem;
    border: none;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:active { opacity: 0.7; }
  .login-btn {
    width: 100%;
    background: #0f172a;
    color: #fff;
    margin-top: 1rem;
  }
  .login-btn:hover { background: #1e293b; }
  .error { color: #dc2626; margin-top: 0.75rem; font-size: 0.875rem; display: none; }
  .welcome { color: #0f172a; font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
  .hidden { display: none; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .top-bar h1 { margin-bottom: 0; }
  .logout-btn {
    background: transparent;
    color: #64748b;
    border: 1px solid #cbd5e1;
  }
  .logout-btn:hover { background: #f1f5f9; }
  .refresh-btn {
    background: #0f172a;
    color: #fff;
  }
  .refresh-btn:hover { background: #1e293b; }
  .order {
    border: 1px solid #e2e8f0;
    border-radius: 0.5rem;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    background: #fafafa;
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.75rem;
    font-size: 0.875rem;
    color: #64748b;
  }
  .order-id { font-family: monospace; font-size: 0.75rem; color: #94a3b8; }
  .order-date { font-size: 0.8rem; }
  .customer-info { margin-bottom: 0.75rem; }
  .customer-info p { font-size: 0.9rem; color: #334155; }
  .customer-info strong { color: #0f172a; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th, td {
    padding: 0.4rem 0.5rem;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
  }
  th { color: #64748b; font-weight: 600; }
  .total-row { font-weight: 600; color: #0f172a; }
  .total-row td { border-bottom: none; padding-top: 0.5rem; }
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: #94a3b8;
  }
  .empty-state p { font-size: 1.1rem; margin-bottom: 0.5rem; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.6rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .status-new { background: #dcfce7; color: #166534; }
</style>
</head>
<body>
  <div class="card" id="loginCard">
    <h1>Admin Login</h1>
    <div id="loginForm">
      <input type="password" id="passcode" placeholder="Enter passcode" autofocus>
      <button class="login-btn" id="loginBtn">Sign in</button>
      <div class="error" id="error">Incorrect passcode</div>
    </div>
    <div id="welcomeSection" class="hidden">
      <p class="welcome">Hi Nathan and Daniel</p>
      <button class="logout-btn logout-btn-only" id="logoutBtn" style="width:100%;margin-top:1.5rem">Logout</button>
    </div>
  </div>

  <div class="card card-wide hidden" id="dashboardCard">
    <div class="top-bar">
      <h1>Orders</h1>
      <div style="display:flex;gap:0.5rem">
        <button class="refresh-btn" id="refreshBtn">Refresh</button>
        <button class="logout-btn" id="logoutBtn2">Logout</button>
      </div>
    </div>
    <div id="ordersContainer">
      <div class="empty-state">
        <p>No orders yet</p>
        <span>Orders placed on the app will appear here</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const passcode = '389276';

      const loginCard = document.getElementById('loginCard');
      const dashboardCard = document.getElementById('dashboardCard');
      const loginForm = document.getElementById('loginForm');
      const welcomeSection = document.getElementById('welcomeSection');
      const passcodeInput = document.getElementById('passcode');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const logoutBtn2 = document.getElementById('logoutBtn2');
      const error = document.getElementById('error');
      const ordersContainer = document.getElementById('ordersContainer');
      const refreshBtn = document.getElementById('refreshBtn');

      function showLogin() {
        loginCard.classList.remove('hidden');
        dashboardCard.classList.add('hidden');
        loginForm.classList.remove('hidden');
        welcomeSection.classList.add('hidden');
        passcodeInput.value = '';
        error.style.display = 'none';
      }

      function showDashboard() {
        loginCard.classList.add('hidden');
        dashboardCard.classList.remove('hidden');
        fetchOrders();
      }

      function logout() {
        localStorage.removeItem('adminAuth');
        showLogin();
        passcodeInput.focus();
      }

      function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function renderOrders(orders) {
        if (!orders || orders.length === 0) {
          ordersContainer.innerHTML =
            '<div class="empty-state"><p>No orders yet</p><span>Orders placed on the app will appear here</span></div>';
          return;
        }
        let html = '';
        for (const order of orders) {
          const itemsHtml = (order.items || []).map(item =>
            `<tr><td>${item.shape || '-'}</td><td>${item.scent || '-'}</td><td>${item.color || '-'}</td><td>${item.size || '-'}g</td><td>${item.quantity}</td><td>Rs. ${(item.price * item.quantity).toLocaleString()}</td></tr>`
          ).join('');

          html += `
            <div class="order">
              <div class="order-header">
                <span style="display:flex;align-items:center;gap:0.5rem">
                  <span class="status-badge status-new">New</span>
                  <span class="order-date">${formatDate(order.submittedAt)}</span>
                </span>
                <span class="order-id">#${(order.id || '').slice(0, 8)}</span>
              </div>
              <div class="customer-info">
                <p><strong>${(order.customer && order.customer.name) || 'N/A'}</strong> &mdash; ${(order.customer && order.customer.email) || ''} ${(order.customer && order.customer.phone) ? '| ' + order.customer.phone : ''}</p>
              </div>
              <table>
                <thead><tr><th>Shape</th><th>Scent</th><th>Color</th><th>Size</th><th>Qty</th><th>Total</th></tr></thead>
                <tbody>${itemsHtml}</tbody>
              </table>
              <div style="margin-top:0.5rem;font-size:0.85rem;text-align:right;color:#334155">
                ${order.discountPercentage > 0 ? 'Discount: ' + order.discountPercentage + '% (-Rs. ' + (order.discountAmount || 0).toLocaleString() + ') &mdash; ' : ''}
                <strong>Total: Rs. ${(order.finalTotal || 0).toLocaleString()}</strong>
              </div>
            </div>`;
        }
        ordersContainer.innerHTML = html;
      }

      async function fetchOrders() {
        ordersContainer.innerHTML = '<div class="empty-state"><p>Loading orders...</p></div>';
        try {
          const res = await fetch('/api/orders');
          if (!res.ok) {
            if (res.status === 500) {
              ordersContainer.innerHTML =
                '<div class="empty-state"><p>Database not configured</p><span>Ask Nathan to add Vercel KV in the Vercel dashboard (Storage &rarr; KV &rarr; Create, free tier). Then deploy once more.</span></div>';
            } else {
              ordersContainer.innerHTML =
                '<div class="empty-state"><p>Failed to load orders</p><span>Status: ' + res.status + '</span></div>';
            }
            return;
          }
          const data = await res.json();
          renderOrders(data.orders);
        } catch (e) {
          ordersContainer.innerHTML =
            '<div class="empty-state"><p>Failed to load orders</p><span>' + e.message + '</span></div>';
        }
      }

      if (localStorage.getItem('adminAuth') === 'true') {
        showDashboard();
      }

      loginBtn.addEventListener('click', function() {
        if (passcodeInput.value === passcode) {
          localStorage.setItem('adminAuth', 'true');
          showDashboard();
        } else {
          error.style.display = 'block';
        }
      });

      passcodeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loginBtn.click();
      });

      logoutBtn.addEventListener('click', logout);
      logoutBtn2.addEventListener('click', logout);
      refreshBtn.addEventListener('click', fetchOrders);
    })();
  </script>
</body>
</html>
