<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle - deep green -->
  <circle cx="256" cy="256" r="256" fill="#2e7d32"/>
  
  <!-- Inner circle - lighter green -->
  <circle cx="256" cy="256" r="220" fill="#4caf50"/>
  
  <!-- Soap bar - cream/white -->
  <rect x="136" y="186" width="240" height="140" rx="20" ry="20" fill="#fff8e1"/>
  
  <!-- Leaf on top of soap - green -->
  <path d="M256,106 C256,106 220,150 190,170 C160,190 150,200 150,200 L256,160 L362,200 C362,200 352,190 322,170 C292,150 256,106 256,106 Z" fill="#1b5e20"/>
  
  <!-- Leaf vein - lighter -->
  <path d="M256,130 L256,175" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/>
  <path d="M256,145 L220,160" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
  <path d="M256,145 L290,160" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
  <path d="M256,160 L230,172" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
  <path d="M256,160 L280,172" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small bubbles - white with transparency -->
  <circle cx="176" cy="280" r="12" fill="#ffffff" opacity="0.8"/>
  <circle cx="336" cy="275" r="10" fill="#ffffff" opacity="0.7"/>
  <circle cx="196" cy="305" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="316" cy="300" r="5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Text "SOAP" - white -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8">SOAP</text>
  
  <!-- Decorative line under text -->
  <rect x="186" y="400" width="140" height="4" rx="2" fill="#fff8e1"/>
</svg>