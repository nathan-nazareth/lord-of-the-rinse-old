<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="soapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f8f6"/>
      <stop offset="100%" style="stop-color:#efece6"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#9b8a66" opacity="0.15"/>
  
  <!-- Soap bar base - rounded rectangle -->
  <rect x="136" y="176" width="240" height="160" rx="24" ry="24" fill="url(#soapGradient)" stroke="#c8bfab" stroke-width="4"/>
  
  <!-- Soap bar top highlight -->
  <rect x="156" y="196" width="200" height="80" rx="16" ry="16" fill="#ffffff" opacity="0.5"/>
  
  <!-- Leaf shape - organic indicator -->
  <g transform="translate(256, 140)">
    <path d="M0,60 C-30,40 -50,0 -30,-30 C-10,-60 20,-50 40,-20 C60,10 30,50 0,60 Z" fill="#7d6d50"/>
    <path d="M0,60 C-20,45 -35,10 -20,-15 C-5,-40 15,-35 30,-10 C45,15 20,50 0,60 Z" fill="#9b8a66"/>
    <path d="M0,60 C-8,-20 -5,-40 0,-55" stroke="#b0a083" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Small decorative dots (bubbles) -->
  <circle cx="180" cy="300" r="8" fill="#c8bfab" opacity="0.6"/>
  <circle cx="200" cy="315" r="5" fill="#c8bfab" opacity="0.4"/>
  <circle cx="320" cy="295" r="6" fill="#c8bfab" opacity="0.5"/>
</svg>