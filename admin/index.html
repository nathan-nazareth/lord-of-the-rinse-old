<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
  }
  .card {
    background: #fff;
    padding: 2.5rem;
    border-radius: 1rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: #0f172a; }
  input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.5rem;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #6366f1; }
  button {
    width: 100%;
    padding: 0.75rem;
    margin-top: 1rem;
    border: none;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:active { opacity: 0.7; }
  .login-btn {
    background: #0f172a;
    color: #fff;
  }
  .login-btn:hover { background: #1e293b; }
  .error { color: #dc2626; margin-top: 0.75rem; font-size: 0.875rem; display: none; }
  .welcome { color: #0f172a; font-size: 1.25rem; font-weight: 600; }
  .logout-btn {
    background: transparent;
    color: #64748b;
    border: 1px solid #cbd5e1;
    margin-top: 1.5rem;
  }
  .logout-btn:hover { background: #f1f5f9; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Admin Login</h1>
    <div id="loginForm">
      <input type="password" id="passcode" placeholder="Enter passcode" autofocus>
      <button class="login-btn" id="loginBtn">Sign in</button>
      <div class="error" id="error">Incorrect passcode</div>
    </div>
    <div id="welcomeSection" class="hidden">
      <p class="welcome">Hi Nathan and Daniel</p>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>
  <script>
    (function() {
      const passcode = '389276';
      const loginForm = document.getElementById('loginForm');
      const welcomeSection = document.getElementById('welcomeSection');
      const passcodeInput = document.getElementById('passcode');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const error = document.getElementById('error');

      function showWelcome() {
        loginForm.classList.add('hidden');
        welcomeSection.classList.remove('hidden');
        error.style.display = 'none';
      }

      function showLogin() {
        loginForm.classList.remove('hidden');
        welcomeSection.classList.add('hidden');
        passcodeInput.value = '';
        error.style.display = 'none';
      }

      if (localStorage.getItem('adminAuth') === 'true') {
        showWelcome();
      }

      loginBtn.addEventListener('click', function() {
        if (passcodeInput.value === passcode) {
          localStorage.setItem('adminAuth', 'true');
          showWelcome();
        } else {
          error.style.display = 'block';
        }
      });

      passcodeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loginBtn.click();
      });

      logoutBtn.addEventListener('click', function() {
        localStorage.removeItem('adminAuth');
        showLogin();
        passcodeInput.focus();
      });
    })();
  </script>
</body>
</html>
